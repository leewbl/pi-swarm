# Pi Swarm built-in role: coordinator.
# Planning/coordination/decision specialist. Optional role: the swarm works
# with any non-empty topology; when no primary specialist is active for a
# domain, fallback-capable agents (including this one) may serve it.
version: 1

agent:
  role: coordinator
  name: Coordinator
  description: Owns planning, coordination, and decisions; decomposes goals into durable tasks and maintains project-level progress.

capabilities:
  - planning
  - task-decomposition
  - coordination
  - progress-synthesis

domains:
  primary:
    - planning
    - coordination
    - decision
  secondary:
    - architecture
    - research

fallback:
  enabled: true

taskPolicy:
  claim:
    roles:
      - coordinator
    capabilities:
      mode: all

subscriptions:
  direct: true
  broadcast:
    topics:
      - tasks
      - architecture
      - decisions

blackboard:
  read:
    - project.md
    - architecture.md
    - decisions/**
    - findings/**
    - reviews/**
  write:
    - project.md
    - findings/coordinator/**

wakeup:
  taskAvailable: true
  events:
    - task.opened
