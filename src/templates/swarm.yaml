# Pi Swarm workspace configuration (template; /swarm init never overwrites
# an existing copy). Mirrors DEFAULT_SWARM_CONFIG from src/protocol/schemas.ts.
version: 1

project:
  name: project

runtime:
  eventPollIntervalMs: 500
  taskScanIntervalMs: 1000
  wakeBatchWindowMs: 250
  heartbeatIntervalMs: 5000
  presenceStaleMs: 15000

scheduling:
  # Global fallback gate; tasks and manifests may still opt out.
  fallbackEnabled: true

liveness:
  # Watchdog warns when serviceable work makes no progress this long.
  warningAfterMs: 60000
  # Watchdog re-wake interval for eligible idle agents.
  rewakeAfterMs: 30000

blackboard:
  # Shared hotspot files and the only roles allowed to write them.
  hotspots:
    project.md:
      - coordinator
    architecture.md:
      - architect
